server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /country-info-st-v1
spring:
  application:
    name: country-info-st-v1
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_CONNECTION_STRING}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
      pool-name: country-info-pool
  jpa:
    properties:
      show-sql: false
    hibernate:
      ddl-auto: none
    show-sql: false

settings:
  country-info-url: ${COUNTRY_INFO_URL:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}

springdoc:
  api-docs:
    version: OPENAPI_3_0
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash
